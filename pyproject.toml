[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-semcom-infra"
version = "0.1.0"
description = "Edge-deployed semantic communication and neural PHY research stack"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Xishuo Wang"}]
keywords = ["semantic-communication", "edge-ai", "jetson", "usrp", "sionna", "neural-phy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
simulation = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "torch>=2.1",
  "torchvision>=0.16",
  "tensorflow>=2.13,<2.16",
  "sionna>=0.18,<1.2",
  "diffusers>=0.25",
  "opencv-python>=4.8",
  "scikit-image>=0.21",
]
onnx = ["onnx>=1.15", "onnxruntime>=1.16"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

