name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: tier
    attributes:
      label: Validation tier
      options: [Repository, Simulation, Jetson, USRP/OTA]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction command
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and hardware
      description: Include OS, Python, framework, CUDA/JetPack/UHD, and device models.
    validations:
      required: true

